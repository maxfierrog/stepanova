name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo device
      - uses: actions/upload-artifact@v4
        with:
          name: stepanova-aarch64
          path: target/aarch64-unknown-linux-gnu/release/stepanova

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  smoke:
    needs: device
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        firmware: ["3.27.1.0", "3.29.1.0"]
    env:
      RMEMU_REF: bdab98106472e1aceab31d633b2dbc18607dd586
      FIRMWARE: ${{ matrix.firmware }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: aetherino/rmemu
          ref: ${{ env.RMEMU_REF }}
          path: rmemu
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: rmemu/firmware
          key: rmpp-firmware-${{ env.FIRMWARE }}
      - uses: actions/download-artifact@v5
        with:
          name: stepanova-aarch64
          path: dist
      - run: scripts/emulator.py rmemu "$FIRMWARE"
      - run: rmemu/bin/rmemu start "$FIRMWARE"
      - run: scripts/smoke.sh rmemu dist/stepanova smoke.png
      - if: always()
        run: rmemu/bin/rmemu logs > emulator.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.firmware }}
          path: |
            smoke.png
            emulator.log
          if-no-files-found: ignore
