[workspace]
resolver = "3"
members = ["crates/core", "crates/device", "crates/server"]

[workspace.package]
version = "0.1.0"
authors = ["Max Fierro"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/maxfierrog/stepanova"
edition = "2024"
publish = false

[workspace.dependencies]
stepanova-core = { path = "crates/core" }
anyhow = "1"

[workspace.lints.rust]
missing_docs = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
